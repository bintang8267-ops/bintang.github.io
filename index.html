<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesan Manis Untukmu 🌸</title>
  
  <!-- Mengambil Font Imut dari Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      /* Background Taman Bunga Manis */
      background: url('https://images.unsplash.com/photo-1526047932273-341f2a7631f9?q=80&w=1600&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Lapisan transparan lembut di atas background */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 240, 245, 0.35);
      backdrop-filter: blur(2px);
      z-index: 1;
    }

    .card {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.88);
      padding: 35px 25px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(230, 115, 158, 0.25);
      border: 3px solid #ffccd5;
      text-align: center;
      max-width: 420px;
      width: 88%;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .judul-kecil {
      font-family: 'Fredoka', cursive;
      color: #ff6b8b;
      font-size: 1.2rem;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    p {
      font-size: 1.15rem;
      color: #5a404c;
      font-weight: 600;
      line-height: 1.6;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      animation: fadeIn 0.5s ease;
    }

    /* Tombol Manis & Imut */
    .btn-container {
      position: relative;
      display: inline-block;
    }

    button {
      font-family: 'Fredoka', cursive;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      color: #6b2d43;
      border: 2px solid #ffffff;
      padding: 14px 28px;
      font-size: 1.1rem;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 154, 158, 0.4);
      transition: all 0.2s ease;
      position: relative;
      outline: none;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(255, 154, 158, 0.6);
      background: linear-gradient(135deg, #ff8489 0%, #fbbbe5 100%);
    }

    button:active {
      transform: scale(0.97);
    }

    /* Animasi Bunga Mekar Melayang */
    .bunga-element {
      position: absolute;
      pointer-events: none;
      font-size: 1.5rem;
      user-select: none;
      z-index: 10;
      animation: bloomAndFly 1s forwards ease-out;
    }

    @keyframes bloomAndFly {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.2) rotate(0deg);
      }
      50% {
        opacity: 1;
        transform: translate(var(--tx), var(--ty)) scale(1.3) rotate(180deg);
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--tx) * 1.5), calc(var(--ty) * 1.5 - 30px)) scale(0.8) rotate(360deg);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="judul-kecil">🌸 Surat Kecil 🌸</div>
    <p id="pesan">Klik tombol di bawah untuk mulai membaca ya! ✨</p>
    
    <div class="btn-container">
      <button id="btnLanjut" onclick="aksiSelanjutnya(event)">Selanjutnya 🌷</button>
    </div>
  </div>

  <script>
    // Kamu bisa ganti atau tambah isi pesannya di bawah ini:
    const daftarPesan = [
      "Halo manis! Makasih ya udah buka link ini 🌸",
      "Semoga hari-harimu selalu dikelilingi hal-hal indah ✨",
      "Jangan lupa tersenyum hari ini, kamu keren banget! 😊",
      "Kalau capek, rehat sebentar dan minum yang manis-manis ya 🧋",
      "Pesan sudah habis! Semoga harimu menyenangkan selalu 👋💖"
    ];

    let indeks = 0;

    function aksiSelanjutnya(event) {
      // 1. Munculkan Efek Bunga Mekar Melayang
      buatEfekBunga(event);

      // 2. Ganti Teks Pesan
      const elemenPesan = document.getElementById("pesan");
      
      // Animasi kedip pesan
      elemenPesan.style.animation = 'none';
      elemenPesan.offsetHeight; // trigger reflow
      elemenPesan.style.animation = 'fadeIn 0.5s ease';

      if (indeks < daftarPesan.length) {
        elemenPesan.innerText = daftarPesan[indeks];
        indeks++;
      } else {
        indeks = 0;
        elemenPesan.innerText = daftarPesan[indeks];
        indeks++;
      }
    }

    // Fungsi membuat partikel bunga mekar saat diklik
    function buatEfekBunga(e) {
      const simbolBunga = ['🌸', '🌺', '🌼', '🌷', '✨', '💖'];
      const jumlahBunga = 12; // Jumlah bunga yang muncul tiap klik

      for (let i = 0; i < jumlahBunga; i++) {
        const bunga = document.createElement('span');
        bunga.classList.add('bunga-element');
        bunga.innerText = simbolBunga[Math.floor(Math.random() * simbolBunga.length)];

        // Posisi awal dari koordinat klik mouse
        bunga.style.left = (e.clientX - 12) + 'px';
        bunga.style.top = (e.clientY - 12) + 'px';
        bunga.style.position = 'fixed';

        // Arah mekar acak (ke segala arah)
        const sudut = Math.random() * Math.PI * 2;
        const jarak = 60 + Math.random() * 80;
        const tx = Math.cos(sudut) * jarak + 'px';
        const ty = Math.sin(sudut) * jarak + 'px';

        bunga.style.setProperty('--tx', tx);
        bunga.style.setProperty('--ty', ty);

        document.body.appendChild(bunga);

        // Hapus elemen bunga setelah animasi selesai
        setTimeout(() => {
          bunga.remove();
        }, 1000);
      }
    }
  </script>

</body>
</html>
